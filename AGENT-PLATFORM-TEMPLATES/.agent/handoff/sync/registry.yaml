schema_version: 2
meta:
  updated_at: "{{DATE}}T00:00:00Z"
  updated_by: bootstrap
  project: "{{PROJECT_NAME}}"

frameworks:
  cursor:
    status: idle
    started_at: null
    last_active: null
    agent_label: ""
    task: ""
    files: []
    # Phase 2A: five-state finality (clean|partial|lost_confirmation|failed|in_progress)
    finality_state: clean
    # Phase 2A: list of completed step IDs from last session — enables targeted resume
    step_manifest: []
  claude:
    status: idle
    started_at: null
    last_active: null
    agent_label: ""
    task: ""
    files: []
    finality_state: clean
    step_manifest: []
  antigravity:
    status: idle
    started_at: null
    last_active: null
    agent_label: ""
    task: ""
    files: []
    finality_state: clean
    step_manifest: []
  codex:
    status: idle
    started_at: null
    last_active: null
    agent_label: ""
    task: ""
    files: []
    finality_state: clean
    step_manifest: []

# Phase 2B: idempotency keys — prevents double-execution on retry or cross-IDE takeover
# Key: sha256(action_type + target + content_hash)[:16]
# Value: { completed_at: ISO8601, framework: string }
completed_actions: {}

protected_paths:
  - "**/node_modules/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/.git/**"

locks: []
